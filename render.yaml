services:
  - type: web
    runtime: static
    name: e-shop-dashboard
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # React Router owns every path, so the CDN has to hand back index.html for
    # anything that is not a real file. Without this, opening or refreshing
    # /signin returns 404 from the CDN and the app never boots. Render serves an
    # existing file at the source path first, so hashed assets are unaffected.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
